<div class="container mt-5">
  <h1>Profile Page</h1>
  <img [src]="imageUrl" alt="Profile picture" class="img-thumbnail" width="150">

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="mt-4">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" type="text" class="form-control" formControlName="username">
      <div class="text-danger" *ngIf="profileForm.get('username')?.invalid && profileForm.get('username')?.touched">
        Username is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email">
      <div class="text-danger" *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">
        A valid email is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="birthday" class="form-label">Birthday</label>
      <input id="birthday" type="date" class="form-control" formControlName="birthday">
    </div>

    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <input id="age" type="number" class="form-control" formControlName="age">
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">Save Changes</button>
    <span class="text-success ms-2" *ngIf="saved">Saved!</span>
  </form>
</div>
